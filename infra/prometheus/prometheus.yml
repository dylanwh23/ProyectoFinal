global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "eventprocessor-worker"
    metrics_path: "/metrics"
    static_configs:
      # Para Windows/Mac con Docker Desktop:
      - targets: ["host.docker.internal:5005"]
      
      # Para Linux Docker:
      # - targets: ["172.17.0.1:5005"]  # Gateway del docker
      
    # Agregar timeout y reintentos
    scrape_timeout: 5s
    # Opcional: etiquetas para organizar
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "eventprocessor-worker-local"