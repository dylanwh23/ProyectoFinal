<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #eee; }
        .camera-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .camera-card:hover { transform: scale(1.02); border-color: #0d6efd; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand" href="#">Monitor Central</a>
            <div class="d-flex gap-2">
                <a href="/eventos-lista.html" class="btn btn-outline-light btn-sm">Ver Eventos Guardados</a>
                <a href="/configuracion.html" class="btn btn-primary btn-sm">Gestionar Cámaras</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="mb-4">Cámaras Activas</h3>
        <div class="row" id="camera-grid">
            <div class="col-12 text-center text-muted">Cargando cámaras...</div>
        </div>
    </div>

    <script>
        async function loadCameras() {
            const grid = document.getElementById('camera-grid');
            try {
                const res = await fetch('/api/camaras/estado');
                const cameras = await res.json();

                grid.innerHTML = '';
                if (cameras.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center mt-5">
                            <p class="text-muted">No hay cámaras configuradas.</p>
                            <a href="/configuracion.html" class="btn btn-outline-primary">Agregar Cámara</a>
                        </div>`;
                    return;
                }

                cameras.forEach(cam => {
                    const statusColor = cam.estaConectada ? 'bg-success' : 'bg-danger';
                    const lastMsg = cam.ultimoMensaje || 'Sin datos recientes';
                    
                    // Al hacer click, vamos al visor de rangos con esa cámara seleccionada
                    // O podemos ir a un visor "live" simple. Usaré el visor de rango por defecto.
                    const html = `
                        <div class="col-md-4 mb-4">
                            <div class="card camera-card h-100" onclick="window.location.href='/visor-rango.html?cam=${cam.ipCamara}'">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title mb-0">${cam.ipCamara}</h5>
                                        <span class="status-indicator ${statusColor}" title="${cam.estaConectada ? 'Online' : 'Offline'}"></span>
                                    </div>
                                    <p class="card-text text-muted small">
                                        <i class="bi bi-hdd-network"></i> ${cam.rutaCarpeta}<br>
                                        <i class="bi bi-activity"></i> ${lastMsg}
                                    </p>
                                </div>
                                <div class="card-footer bg-transparent border-top-0">
                                    <img src="/api/frame/${cam.ipCamara}" class="img-fluid rounded" 
                                         alt="Preview" 
                                         onerror="this.style.display='none'">
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += html;
                });

            } catch (e) {
                grid.innerHTML = `<div class="alert alert-danger">Error cargando cámaras: ${e.message}</div>`;
            }
        }

        loadCameras();
        setInterval(loadCameras, 10000); // Refrescar cada 10s
    </script>
</body>
</html>
