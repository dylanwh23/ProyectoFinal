<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Embebido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .viewer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        #mainImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .controls {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .controls.hidden {
                display: none;
            }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

            button:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.3);
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #667eea;
                cursor: pointer;
            }

            input[type="range"]::-moz-range-thumb {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #667eea;
                cursor: pointer;
                border: none;
            }

        .info {
            color: white;
            font-size: 12px;
            font-family: monospace;
            white-space: nowrap;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="viewer">
        <div class="image-container" id="container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Cargando imágenes...</p>
            </div>
        </div>
        <div class="controls" id="controls">
            <button onclick="anteriorImagen()" id="btnPrev">◀</button>
            <div class="slider-container">
                <input type="range" id="imageSlider" min="0" max="0" value="0" oninput="cambiarImagen(this.value)">
                <span class="info" id="imageInfo">-</span>
            </div>
            <button onclick="siguienteImagen()" id="btnNext">▶</button>
        </div>
    </div>

    <script>const API_BASE = '';
        let currentImages = [];
        let currentIndex = 0;
        let currentCameraName = null;

        // Leer parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const cameraName = params.get('cam');
        const desde = parseInt(params.get('desde'));
        const hasta = parseInt(params.get('hasta'));
        const hideControls = params.get('controls') === 'false'; // ?controls=false para ocultar controles
        const autoplay = params.get('autoplay') === 'true'; // ?autoplay=true para reproducción automática
        const speed = parseInt(params.get('speed')) || 1000; // ?speed=500 para velocidad en ms

        let autoplayInterval = null;

        window.addEventListener('DOMContentLoaded', async () => {
            // Ocultar controles si se solicita
            if (hideControls) {
                document.getElementById('controls').classList.add('hidden');
            }

            // Validar parámetros
            if (!cameraName || isNaN(desde) || isNaN(hasta)) {
                mostrarError('Parámetros inválidos. Uso: ?cam=camara1&desde=200&hasta=210');
                return;
            }

            await cargarRango();

            // Iniciar autoplay si se solicita
            if (autoplay && currentImages.length > 0) {
                iniciarAutoplay();
            }
        });

        async function cargarRango() {
            try {
                const response = await fetch(
                    `${API_BASE}/history/list-by-range/${cameraName}?desde=${desde}&hasta=${hasta}`
                );

                if (!response.ok) {
                    throw new Error('Error al cargar el rango de imágenes');
                }

                const data = await response.json();

                if (data.files.length === 0) {
                    mostrarError('No se encontraron imágenes en el rango especificado');
                    return;
                }

                currentImages = data.files;
                currentCameraName = cameraName;
                currentIndex = 0;

                document.getElementById('loading').style.display = 'none';
                mostrarImagen();
                cargarImagen(0);

            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error al cargar: ' + error.message);
            }
        }

        function mostrarImagen() {
            const container = document.getElementById('container');
            container.innerHTML = '<img id="mainImage" src="" alt="Imagen">';

            const slider = document.getElementById('imageSlider');
            slider.max = currentImages.length - 1;
        }

        function cargarImagen(index) {
            if (index < 0 || index >= currentImages.length) return;

            currentIndex = index;
            const imageData = currentImages[index];
            const img = document.getElementById('mainImage');

            img.src = `${API_BASE}/history/image/${currentCameraName}/${imageData.number}?t=${Date.now()}`;

            document.getElementById('imageInfo').textContent = `${index + 1}/${currentImages.length}`;
            document.getElementById('imageSlider').value = index;

            // Actualizar botones
            document.getElementById('btnPrev').disabled = index === 0;
            document.getElementById('btnNext').disabled = index === currentImages.length - 1;
        }

        function cambiarImagen(index) {
            cargarImagen(parseInt(index));
        }

        function anteriorImagen() {
            if (currentIndex > 0) {
                cargarImagen(currentIndex - 1);
            }
        }

        function siguienteImagen() {
            if (currentIndex < currentImages.length - 1) {
                cargarImagen(currentIndex + 1);
            } else if (autoplayInterval) {
                // Si está en autoplay y llega al final, volver al inicio
                cargarImagen(0);
            }
        }

        function iniciarAutoplay() {
            if (autoplayInterval) return;

            autoplayInterval = setInterval(() => {
                if (currentIndex < currentImages.length - 1) {
                    siguienteImagen();
                } else {
                    cargarImagen(0); // Volver al inicio
                }
            }, speed);
        }

        function detenerAutoplay() {
            if (autoplayInterval) {
                clearInterval(autoplayInterval);
                autoplayInterval = null;
            }
        }

        function mostrarError(mensaje) {
            const container = document.getElementById('container');
            container.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${mensaje}</p></div>`;
        }

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (currentImages.length === 0) return;

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                anteriorImagen();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                siguienteImagen();
            } else if (e.key === ' ') {
                e.preventDefault();
                if (autoplayInterval) {
                    detenerAutoplay();
                } else {
                    iniciarAutoplay();
                }
            }
        });

        // Limpiar autoplay al cerrar
        window.addEventListener('beforeunload', detenerAutoplay);</script>
</body>
</html>
