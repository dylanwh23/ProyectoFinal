<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cámaras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-camera-video"></i> Telnet Interceptor
            </a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">Volver al Monitor</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Agregar Nueva Cámara</h5>
                    </div>
                    <div class="card-body">
                        <form id="formAgregar">
                            <div class="mb-3">
                                <label class="form-label">Dirección IP</label>
                                <input type="text" class="form-control" id="ipCamara" placeholder="Ej: 192.168.1.50" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Puerto Telnet</label>
                                <input type="number" class="form-control" id="puerto" value="23" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ruta de Imágenes (Carpeta)</label>
                                <input type="text" class="form-control" id="rutaCarpeta" placeholder="Ej: C:\Camaras\Cam1 o \\NAS\Fotos" required>
                                <div class="form-text">Ruta local o de red donde la cámara guarda las fotos.</div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-plus-circle"></i> Agregar Cámara
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Cámaras Registradas</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="cargarCamaras()">
                            <i class="bi bi-arrow-clockwise"></i> Actualizar
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Estado</th>
                                        <th>IP : Puerto</th>
                                        <th>Ruta Almacenamiento</th>
                                        <th>Último Mensaje</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCamaras">
                                    <tr><td colspan="5" class="text-center py-4">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', cargarCamaras);

        async function cargarCamaras() {
            const tbody = document.getElementById('tablaCamaras');
            try {
                // LLAMADA AL NUEVO ENDPOINT
                const response = await fetch('/api/camaras/estado');
                
                if (!response.ok) throw new Error("Error al consultar API");
                
                const camaras = await response.json();

                tbody.innerHTML = '';

                if (camaras.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay cámaras registradas.</td></tr>';
                    return;
                }

                camaras.forEach(cam => {
                    const statusClass = cam.estaConectada ? 'status-online' : 'status-offline';
                    const statusText = cam.estaConectada ? 'Conectada' : 'Desconectada';
                    
                    const row = `
                        <tr>
                            <td><span class="status-dot ${statusClass}"></span> ${statusText}</td>
                            <td><strong>${cam.ipCamara}</strong> : ${cam.puerto}</td>
                            <td class="text-muted small text-truncate" style="max-width: 200px;" title="${cam.rutaCarpeta}">${cam.rutaCarpeta}</td>
                            <td class="small">${cam.ultimoMensaje || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="eliminarCamara('${cam.ipCamara}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">No se pudo conectar con el servidor.</td></tr>';
            }
        }

        document.getElementById('formAgregar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            const data = {
                ipCamara: document.getElementById('ipCamara').value,
                puerto: parseInt(document.getElementById('puerto').value),
                rutaCarpeta: document.getElementById('rutaCarpeta').value
            };

            try {
                const res = await fetch('/api/camaras', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('formAgregar').reset();
                    cargarCamaras();
                } else {
                    const err = await res.json();
                    alert('Error: ' + (err.error || 'No se pudo agregar'));
                }
            } catch (error) {
                alert('Error de red al agregar cámara');
            } finally {
                btn.disabled = false;
            }
        });

        async function eliminarCamara(ip) {
            if (!confirm(`¿Seguro que deseas eliminar la cámara ${ip}?`)) return;

            try {
                await fetch(`/api/camaras/${ip}`, { method: 'DELETE' });
                cargarCamaras();
            } catch (error) {
                alert('Error al eliminar');
            }
        }
    </script>
</body>
</html>
