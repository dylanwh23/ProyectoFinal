<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor de Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        #viewer { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        img { max-height: 90vh; max-width: 100%; }
        .controls { background: #222; padding: 15px; }
    </style>
</head>
<body>
    <div id="viewer">
        <img id="img-display" src="">
    </div>

    <div class="controls">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/eventos-lista.html" class="btn btn-outline-secondary">Volver</a>
            
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light" onclick="prev()">❮ Anterior</button>
                <span id="counter">0 / 0</span>
                <button class="btn btn-light" onclick="next()">Siguiente ❯</button>
            </div>

            <button class="btn btn-primary" onclick="playPause()">⏯ Play</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        let evento = null;
        let index = 0;
        let timer = null;

        async function init() {
            if(!id) return alert("ID no especificado");
            // Nota: El endpoint GET /eventos retorna la lista. 
            // Para obtener uno solo podríamos usar GET /eventos/{id} si existiera, 
            // pero si no, buscamos en la lista. Asumamos que creaste el endpoint individual o filtramos.
            // Para simplificar, obtenemos todos y filtramos en JS (no óptimo para producción pero funciona aquí)
            
            const res = await fetch('/eventos'); 
            const lista = await res.json();
            evento = lista.find(e => e.eventoId === id);

            if(!evento) return alert("Evento no encontrado");

            updateImage();
        }

        function updateImage() {
            if(!evento || evento.imagenes.length === 0) return;
            const imgFile = evento.imagenes[index].rutaRelativa;
            
            // Construir URL de la imagen del evento
            document.getElementById('img-display').src = `/eventos/${id}/image/${imgFile}`;
            document.getElementById('counter').innerText = `${index + 1} / ${evento.imagenes.length}`;
        }

        function next() {
            if(index < evento.imagenes.length - 1) index++;
            else index = 0; // Loop
            updateImage();
        }

        function prev() {
            if(index > 0) index--;
            updateImage();
        }

        function playPause() {
            if(timer) {
                clearInterval(timer);
                timer = null;
            } else {
                timer = setInterval(next, 200); // 5 fps
            }
        }

        init();
    </script>
</body>
</html>
