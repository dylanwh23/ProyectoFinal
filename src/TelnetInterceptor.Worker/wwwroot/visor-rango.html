<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explorador de Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            margin: 0;
            overflow: hidden;
        }
        #main-container { 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #live-stream-img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }
        .controls { 
            background: #222; 
            padding: 15px; 
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .loading-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-dark border-bottom border-secondary">
        <h5 class="m-0" id="cam-title">Cargando...</h5>
        <div class="d-flex gap-2">
            <a href="/eventos-lista.html" class="btn btn-outline-info btn-sm">📚 Eventos</a>
            <a href="/" class="btn btn-outline-secondary btn-sm">Volver</a>
        </div>
    </div>

    <div id="main-container">
        <img id="live-stream-img" src="" alt="Visor">
        <div class="loading-overlay" id="loading-overlay">
            <div class="text-center">
                <div class="spinner-border text-light mb-3" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p id="loading-text">Cargando...</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="cargarUltimos(60)" id="btn-1min">
                        🕐 Último 1 Min
                    </button>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-outline-warning w-100" onclick="cargarUltimos(300)" id="btn-5min">
                        5 Min
                    </button>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-light w-100" onclick="iniciarStream()" id="btn-live">
                        📡 En Vivo
                    </button>
                </div>
                <div class="col-md-5">
                    <input type="range" class="form-range" id="history-slider" disabled>
                    <div class="text-center small text-muted" id="timestamp-display">-</div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-success w-100" onclick="guardarEvento()" id="btn-save">
                        💾 Guardar Evento
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let cameraName = null;
        let isStreaming = false;
        let fileHistory = [];
        let currentHistoryId = null;

        // Obtener parámetros de URL
        const params = new URLSearchParams(window.location.search);
        cameraName = params.get("cam");

        // Inicialización
        if (cameraName) {
            document.getElementById('cam-title').innerText = `Cámara: ${cameraName}`;
            iniciarStream();
        } else {
            document.getElementById('cam-title').innerText = "Error: No se especificó cámara";
            showError("Debe especificar una cámara en la URL: ?cam=nombre");
        }

        // Función para mostrar overlay de carga
        function showLoading(message = "Cargando...") {
            document.getElementById('loading-text').textContent = message;
            document.getElementById('loading-overlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('active');
        }

        function showError(message) {
            document.getElementById('main-container').innerHTML = `
                <div class="text-center text-danger p-5">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Iniciar stream en vivo
        function iniciarStream() {
            if (!cameraName) return;

            isStreaming = true;
            currentHistoryId = null;
            fileHistory = [];

            const img = document.getElementById('live-stream-img');
            img.src = `/api/stream/${cameraName}?t=${Date.now()}`;
            
            document.getElementById('cam-title').innerText = `Cámara: ${cameraName} (En Vivo 📡)`;
            document.getElementById('timestamp-display').textContent = "Transmisión en vivo";

            const slider = document.getElementById('history-slider');
            slider.disabled = false;
            slider.max = 1;
            slider.value = 1;
        }

        // Detener stream
        function detenerStream() {
            isStreaming = false;
            const img = document.getElementById('live-stream-img');
            img.src = "";
        }

        // Cargar últimos N segundos
        async function cargarUltimos(segundos) {
            if (!cameraName) return;

            detenerStream();
            showLoading(`Cargando últimos ${segundos} segundos...`);

            try {
                const endTime = new Date();
                const startTime = new Date(endTime.getTime() - (segundos * 1000));

                const formatLocalISO = (dt) => {
                    const pad = (n) => n.toString().padStart(2, '0');
                    return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
                };

                const startTimeISO = formatLocalISO(startTime);
                const endTimeISO = formatLocalISO(endTime);

                const response = await fetch(
                    `/api/history/freeze-by-range-local/${cameraName}?startTime=${startTimeISO}&endTime=${endTimeISO}`
                );

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const snapshot = await response.json();

                currentHistoryId = snapshot.historyId;
                fileHistory = snapshot.files || [];

                if (fileHistory.length > 0) {
                    const slider = document.getElementById('history-slider');
                    slider.max = fileHistory.length - 1;
                    slider.disabled = false;
                    
                    console.log(`Historial cargado: ${fileHistory.length} archivos.`);
                    
                    // Mostrar primera imagen
                    mostrarImagenHistorial(0);
                    slider.value = 0;

                    document.getElementById('cam-title').innerText = 
                        `Cámara: ${cameraName} (Historial: ${fileHistory.length} imágenes)`;
                } else {
                    showError(`No se encontraron imágenes en los últimos ${segundos} segundos`);
                }

            } catch (error) {
                console.error("Error cargando historial:", error);
                showError(`Error al cargar historial: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        // Mostrar imagen del historial
        function mostrarImagenHistorial(index) {
            if (!fileHistory || fileHistory.length === 0) return;

            const filePath = fileHistory[index];
            if (!filePath) return;

            const img = document.getElementById('live-stream-img');
            img.src = `/api/frame/${cameraName}?file=${encodeURIComponent(filePath)}&t=${Date.now()}`;

            document.getElementById('timestamp-display').textContent = 
                `Imagen ${index + 1} de ${fileHistory.length}`;
            
            // Manejar error de carga
            img.onerror = function() {
                console.error('Error al cargar imagen:', filePath);
                document.getElementById('timestamp-display').textContent = 
                    `Error cargando imagen ${index + 1}`;
            };
        }

        // Event listener para el slider
        document.getElementById('history-slider').addEventListener('input', function(e) {
            if (!isStreaming && fileHistory.length > 0) {
                const index = parseInt(e.target.value);
                mostrarImagenHistorial(index);
            }
        });

        // Guardar evento actual
        async function guardarEvento() {
            if (!cameraName) return;

            const nombre = prompt(
                "Nombre para este evento:", 
                `Evento ${new Date().toLocaleDateString()}`
            );
            
            if (!nombre) return;

            // Determinar rango a guardar
            let desde, hasta;
            if (fileHistory.length > 0) {
                // Si hay historial cargado, usar esas imágenes
                desde = 0;
                hasta = fileHistory.length - 1;
            } else {
                // Si está en vivo, guardar último minuto
                desde = 60;
                hasta = 0;
            }

            showLoading("Guardando evento...");

            try {
                const data = {
                    cameraName: cameraName,
                    desde: desde,
                    hasta: hasta,
                    nombre: nombre
                };

                const res = await fetch('/eventos/crear', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    const evento = await res.json();
                    alert(`Evento guardado correctamente con ${evento.cantidadImagenes} imágenes`);
                    
                    // Preguntar si quiere ver el evento
                    if (confirm("¿Desea ver el evento guardado?")) {
                        window.location.href = `/visor-evento.html?id=${evento.eventoId}`;
                    }
                } else {
                    const error = await res.text();
                    alert("Error al guardar: " + error);
                }
            } catch (e) {
                alert("Error de red: " + e.message);
            } finally {
                hideLoading();
            }
        }

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (!fileHistory || fileHistory.length === 0) return;

            const slider = document.getElementById('history-slider');
            const currentIndex = parseInt(slider.value);

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    if (currentIndex > 0) {
                        slider.value = currentIndex - 1;
                        mostrarImagenHistorial(currentIndex - 1);
                    }
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    if (currentIndex < fileHistory.length - 1) {
                        slider.value = currentIndex + 1;
                        mostrarImagenHistorial(currentIndex + 1);
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    iniciarStream();
                    break;
            }
        });
    </script>
</body>
</html>
