<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eventos Guardados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📚 Eventos Guardados</h2>
            <a href="/" class="btn btn-outline-dark">Volver al Monitor</a>
        </div>

        <div class="row" id="lista-eventos">
            <div class="col-12 text-center">Cargando...</div>
        </div>
    </div>

    <script>
        async function cargarEventos() {
            const container = document.getElementById('lista-eventos');
            try {
                const res = await fetch('/eventos');
                const eventos = await res.json();

                container.innerHTML = '';
                if (eventos.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">No hay eventos guardados.</div>';
                    return;
                }

                eventos.forEach(ev => {
                    // Usamos la primera imagen como portada
                    const portada = ev.imagenes.length > 0 
                        ? `/eventos/${ev.eventoId}/image/${ev.imagenes[0].rutaRelativa}`
                        : '';

                    const fecha = new Date(ev.fechaCreacion).toLocaleString();

                    const html = `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm">
                                <div style="height: 200px; overflow: hidden; background: #000;">
                                    <img src="${portada}" class="card-img-top" style="object-fit: cover; height: 100%; width: 100%;">
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title">${ev.nombre}</h5>
                                    <p class="card-text text-muted small">
                                        Cámara: <strong>${ev.cameraName}</strong><br>
                                        Fecha: ${fecha}<br>
                                        Imágenes: ${ev.cantidadImagenes}
                                    </p>
                                    <div class="d-flex justify-content-between">
                                        <a href="/visor-evento.html?id=${ev.eventoId}" class="btn btn-primary btn-sm">Ver Evento</a>
                                        <button onclick="borrarEvento('${ev.eventoId}')" class="btn btn-outline-danger btn-sm">Borrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });

            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
            }
        }

        async function borrarEvento(id) {
            if(!confirm("¿Eliminar evento?")) return;
            await fetch(`/eventos/${id}`, { method: 'DELETE' });
            cargarEventos();
        }

        cargarEventos();
    </script>
</body>
</html>
